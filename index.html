<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Analyzer</title>
    <link rel="shortcut icon" href="Images/images.jfif" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <p class="tag">JAVASCRIPT MINI PROJECT</p>
            <h1>Number Analyzer</h1>
            <p class="subtitle">Check whether your number is Positive, Negative, Even or Odd.</p>

            <label for="numberInput">Enter a Number</label>
            <input id="numberInput" type="number" placeholder="Enter number">
            <button id="checkBtn">Analyze Number</button>

            <div id="resultBox" class="result-box">
                <h2 id="resultTitle">Result will appear here</h2>
                <p id="resultText">Enter a number and click Analyze.</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
